<!doctype html>
<meta charset="utf-8">
<title>QA multiline + form</title>
<style>
body { font-family: sans-serif; background: #fff; }
textarea, input { width: 96%; margin: 0.5em 0; font-size: 1.2em; display: block; }
</style>
<h1>Continuous textarea</h1>
<textarea id="multi" rows="8" placeholder="multiline field — scan here for step 4"></textarea>
<h1>Form fields</h1>
<input id="f1" placeholder="form field 1 — scan here for step 5">
<input id="f2" placeholder="form field 2">
<input id="f3" placeholder="form field 3">
<h1>Form QR (step 5)</h1>
<p>Scan into form field 1 with the Form switch ON: F1SCAN &rarr; field 1, F2SCAN &rarr; field 2, F3SCAN &rarr; field 3.</p>
<img id="form" src="qr-form-F1SCAN-F2SCAN-F3SCAN.png" alt="QR F1SCAN F2SCAN F3SCAN" style="max-width:60vmin">
